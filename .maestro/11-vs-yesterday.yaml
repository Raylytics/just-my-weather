# Vs. yesterday: switched on in Customize, the module lands on the glance
# with today's forecast high and low.
#
# In NWS territory yesterday is what the station measured, so even a fresh
# install can show the changes; abroad, or with a station that covered too
# little of yesterday, they read "—" until the app's own record has a day.
# That depends on live data, so this checks only that the module is offered,
# that switching it on fetches its data, and that it draws its two lines.
appId: io.raylytics.justmyweather
---
- launchApp:
    clearState: true
    permissions:
      all: allow
# Answer the CMP notice a fresh install shows where ads are configured.
- runFlow: subflows/consent.yaml
- extendedWaitUntil:
    visible: "Customize"
    timeout: 60000
- assertNotVisible: "Vs. yesterday"

- tapOn: "Customize"
- scrollUntilVisible:
    element:
      id: "toggle_vs_yesterday"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: "toggle_vs_yesterday"
- tapOn: "Done"

- extendedWaitUntil:
    visible: "Vs. yesterday"
    timeout: 10000
# Today's high and low, each with its change (or a dash, see above).
- extendedWaitUntil:
    visible: "High .*"
    timeout: 20000
