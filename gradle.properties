# 6 GB: Kotlin/Native links the iOS framework inside this daemon, and the
# Release link of the Compose framework (scripts/ios/archive.sh) ran out of
# heap at 2 GB. Android builds use what they used before.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

kotlin.code.style=official

# The shared module's iOS targets need Xcode, so they cannot build on CI's Linux
# runners (plan decision 7: iOS is gated locally). Skip them there quietly.
kotlin.native.ignoreDisabledTargets=true
