# Hooks from the Raylytics VC Standard (templates/pre-commit/base.yaml + android.yaml).
# The font licence and the store listing copy are kept byte-for-byte, so the
# whitespace fixers skip them.
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: end-of-file-fixer
    exclude: ^(shared/src/iosMain/ROBOTO-OFL\.txt|store-assets/.*\.txt)$
  - id: trailing-whitespace
    exclude: ^(shared/src/iosMain/ROBOTO-OFL\.txt|store-assets/.*\.txt)$
  - id: check-merge-conflict
  - id: check-added-large-files
    args:
    - --maxkb=5120
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - --strict
    - feat
    - fix
    - perf
    - refactor
    - style
    - docs
    - test
    - build
    - ci
    - chore
    - revert
- repo: local
  hooks:
  - id: no-ai-bylines
    name: refuse AI bylines
    entry: 'Co-Authored-By: (Claude|Copilot|Cursor)|noreply@anthropic\.com|Generated with \[?Claude'
    language: pygrep
    stages:
    - commit-msg
  - id: subject-72
    name: subject line at most 72 characters
    entry: \A[^\n]{73,}
    language: pygrep
    args:
    - --multiline
    stages:
    - commit-msg
  - id: ktlint
    name: ktlint (gradle ktlintCheck)
    entry: ./gradlew ktlintCheck --quiet
    language: system
    types:
    - kotlin
    pass_filenames: false
